# Local development only. Staging and production must use separate credentials.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: isaber_dev
      POSTGRES_PASSWORD: isaber_local_only
      POSTGRES_DB: isaber
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isaber_dev -d isaber"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:

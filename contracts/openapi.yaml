        maxLength: 160
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Stable URL identifier; supply a romanized or English identifier for Chinese titles.
    article_status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - draft
        - published
    visibility:
      name: visibility
      in: query
      required: false
      schema:
        type: string
        enum:
        - public
        - private
    comment_status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - pending
        - approved
        - rejected
        - removed
    comment_article:
      name: article_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Retained for 24 hours. Replays the original result for the same semantic payload; mismatched
        payload or in-progress request returns 409. See API design for scope and authorization.

components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: __Host-isaber_session
      description: Opaque HttpOnly Secure SameSite=Strict owner session; never store in browser localStorage.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by owner login/session. Required with session for every owner mutation except
        login.
  parameters:
    article_id:
      name: article_id
      in: path
      required: true
      schema:
        type: string
        format: uuid

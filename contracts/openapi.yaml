        type: string
        minLength: 1
        maxLength: 160
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Stable URL identifier; supply a romanized or English identifier for Chinese titles.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      description: Opaque continuation token tied to the original filters and query.
    q:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: .*\S.*
      description: Nonempty search text. English case-insensitive word matching; Chinese literal substring matching.
    admin_q:

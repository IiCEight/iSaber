openapi: 3.1.1
info:
  title: iSaber Blog API
  version: 0.1.0
  description: Owner-approved API contract baseline against the approved PRD. Not an implemented server. One owner,
    no reader accounts. See docs/architecture/api-design.md and data-model.md. All article, session, admin, search,
    and asset delivery uses no-store until an explicit cache/privacy design is approved.
servers:
- url: /api/v1
  description: Same origin as the React website
security: []
tags:
- name: Authentication
- name: Public
- name: Administration
- name: Publishing
- name: Imports
- name: Taxonomy
- name: Comments
- name: Assets
paths:
  /auth/login:
    post:
      operationId: loginOwner
      summary: Sign in as the owner
      tags:
      - Authentication
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Set-Cookie:
              schema:
                type: string
              description: Opaque __Host-isaber_session cookie; Secure; HttpOnly; SameSite=Strict; Path=/; no Domain.
                Never return its value in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      description: Same-origin JSON only; rate-limited. Invalid credentials return 401. Creates a fresh session
        cookie and returns the CSRF token. Owner provisioning is an operational command, not an API.
  /auth/session:
    get:
      operationId: getOwnerSession
      summary: Get the current owner session
      tags:
      - Authentication
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: Revoke the session
      tags:
      - Authentication
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '204':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Set-Cookie:
              schema:
                type: string
              description: Clear the session cookie with the same attributes and Max-Age=0.
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
  /articles:
    get:
      operationId: listPublicArticles
      summary: List public published articles
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/tag'
      description: Newest first by first publication time then ID. Never returns drafts, private articles, or their
        metadata.
  /articles/search:
    get:
      operationId: searchPublicArticles
      summary: Search public published articles
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/tag'
      description: Rank by title, then summary/tags, then body matches; ties by publication time and ID. Does not
        search comments. No shared caching.
  /articles/{slug}:
    get:
      operationId: getPublicArticle
      summary: Read a public published article
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      description: Returns only the live public revision even with an owner cookie. Missing or nonpublic articles
        return 404.
  /categories:
    get:
      operationId: listPublicCategories
      summary: List public categories
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Include only labels used by current public published revisions. Order by name then ID.
  /admin/categories:
    get:
      operationId: listAdminCategories
      summary: List all categories
      tags:
      - Taxonomy
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    post:
      operationId: createCategory
      summary: Create a category
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabel'
      description: Duplicate slug returns 409. Creating a label does not assign it to an article.
  /admin/categories/{label_id}:
    patch:
      operationId: renameCategory
      summary: Rename a category
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/label_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameLabel'
      description: Stable slug and associations; stale version returns 409. Update live metadata dates and article
        versions for affected articles transactionally.
  /tags:
    get:
      operationId: listPublicTags
      summary: List public tags
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Include only labels used by current public published revisions. Order by name then ID.
  /admin/tags:
    get:
      operationId: listAdminTags
      summary: List all tags
      tags:
      - Taxonomy
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    post:
      operationId: createTag
      summary: Create a tag
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabel'
      description: Duplicate slug returns 409. Creating a label does not assign it to an article.
  /admin/tags/{label_id}:
    patch:
      operationId: renameTag
      summary: Rename a tag
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/label_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameLabel'
      description: Stable slug and associations; stale version returns 409. Update live metadata dates and article
        versions for affected articles transactionally.
  /articles/{article_id}/assets/{asset_id}:
    get:
      operationId: getArticleAsset
      summary: Read an authorized article image
      tags:
      - Assets
      security:
      - {}
      - ownerSession: []
      responses:
        '200':
          description: Validated image bytes. Authorization is checked before streaming.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/asset_id'
      description: 'Anonymous callers can read only assets attached to the current live revision of a public article.
        An authenticated owner can read retained revisions of this article. All other cases return 404. Never redirect
        to a public object URL. Always Cache-Control: no-store.'
  /articles/{article_id}/comments:
    get:
      operationId: listPublicComments
      summary: List approved article comments
      tags:
      - Comments
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Public published articles only; otherwise 404. Order by created_at then ID ascending. Existing
        approved comments remain visible if new submissions are disabled.
    post:
      operationId: submitGuestComment
      summary: Submit a comment for moderation
      tags:
      - Comments
      security: []
      responses:
        '202':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReceipt'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitComment'
      description: 'No reader account. Require a currently public published article with comments enabled. Return
        only pending status, never moderation details or comment text. Nonpublic article: 404; comments disabled:
        409; invalid text: 422; rate limit: 429.'
  /admin/articles:
    get:
      operationId: listAdminArticles
      summary: List owner articles
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/admin_q'
      - $ref: '#/components/parameters/article_status'
      - $ref: '#/components/parameters/visibility'
      description: Includes private and draft articles. Newest modified_at first, then ID. Status is published if
        a live revision exists; has_draft is independent.
  /admin/articles/{article_id}:
    get:
      operationId: getAdminArticle
      summary: Get live and draft owner state
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
    patch:
      operationId: updateArticleControls
      summary: Change visibility or comment controls
      tags:
      - Administration
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleControls'
      description: Controls apply immediately to current article state and all read paths. This does not publish
        the draft. Stale expected_version returns 409.
  /admin/articles/{article_id}/draft:
    patch:
      operationId: updateDraftMetadata
      summary: Save draft metadata
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPatch'
      description: Requires an existing draft; otherwise 409 no_draft. Creates a new snapshot. Omitted fields remain
        unchanged. Slug edits after first publication are rejected. Content replacement uses import, not this operation.
        Invalid references are blocking draft issues.
  /admin/articles/{article_id}/preview:
    get:
      operationId: previewDraft
      summary: Preview the current draft
      tags:
      - Publishing
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      description: Only current draft; no draft returns 404. Normalized Markdown and issue details use the same
        content rendering specification as the live page.
  /admin/articles/{article_id}/publish:
    post:
      operationId: publishArticle
      summary: Publish an article
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      description: Requires a publishable current draft. Atomically switch the live pointer and dates; clear draft
        pointer. 422 if blocked; 409 if stale or no draft. Visibility is set separately.
  /admin/articles/{article_id}/unpublish:
    post:
      operationId: unpublishArticle
      summary: Unpublish an article
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      description: Immediately remove the live pointer. Retain a newer draft, or use the withdrawn live snapshot
        as the draft. Preserve publication time and history. Already unpublished with matching version is a no-op.
  /admin/articles/{article_id}/revisions:
    get:
      operationId: listArticleRevisions
      summary: List previously published snapshots
      tags:
      - Publishing
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Only snapshots that have been published. Order by first_published_at descending then ID. Draft
        is returned in owner article detail.
  /admin/articles/{article_id}/revisions/{revision_id}:
    get:
      operationId: getArticleRevision
      summary: Read a historical published snapshot
      tags:
      - Publishing
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/revision_id'
      description: Revision must belong to the article and have publication history; otherwise 404.
  /admin/articles/{article_id}/revisions/{revision_id}/restore:
    post:
      operationId: restoreArticleRevision
      summary: Copy history into a new draft
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/revision_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      description: Only a previously published revision of this article. Does not publish, change visibility, or
        change the stable slug. Stale article version returns 409.
  /admin/imports:
    post:
      operationId: createImport
      summary: Upload Markdown or a ZIP for draft import
      tags:
      - Imports
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '202':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Location:
              schema:
                type: string
              description: /api/v1/admin/imports/{import_id} for polling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 'One UTF-8 .md or ZIP with exactly one article and images. New import: omit article_id and expected_version.
        Replacement: require both. 5 MiB Markdown; 10 MiB per image; 50 MiB compressed ZIP; 100 MiB expanded ZIP;
        200 files. 413 for request size, 415 for unsupported file kind, 422 for invalid request fields. Structural
        processing errors appear in a failed job. Missing editorial metadata/assets can produce a successful but
        non-publishable draft. Existing state changes only after complete processing and a second version check.
        Jobs and staged files are durable; restart failures must be explicit. Replayed requests return the original
        acceptance, then poll the job.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                article_id:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  minimum: 1
              required:
              - file
              additionalProperties: false
              dependentRequired:
                article_id:
                - expected_version
                expected_version:
                - article_id
            encoding:
              file:
                contentType: text/markdown, application/zip, application/octet-stream
  /admin/imports/{import_id}:
    get:
      operationId: getImport
      summary: Get import progress and results
      tags:
      - Imports
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/import_id'
      description: Returns 200 for all existing job states, including failure. Poll until succeeded or failed; article/revision
        IDs identify the committed draft after success.
  /admin/comments:
    get:
      operationId: listAdminComments
      summary: List comments for moderation
      tags:
      - Comments
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/comment_article'
      - $ref: '#/components/parameters/comment_status'
      description: Newest created_at first then ID; includes pending comments and comments on unpublished/private
        articles.
  /admin/comments/{comment_id}:
    patch:
      operationId: moderateComment
      summary: Approve, reject, or remove a comment
      tags:
      - Comments
      security:
      - ownerSession: []
        csrfToken: []

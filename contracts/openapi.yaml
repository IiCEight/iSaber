openapi: 3.1.1
info:
  title: iSaber Blog API
  version: 0.1.0
  description: Owner-approved API contract baseline against the approved PRD. Authentication implemented for review; other business handlers pending. One owner,
    no reader accounts. See docs/architecture/api-design.md and data-model.md. All article, session, admin, search,
    and asset delivery uses no-store until an explicit cache/privacy design is approved.
servers:
- url: /api/v1
  description: Same origin as the React website
security: []
tags:
- name: Authentication
- name: Public
- name: Administration
- name: Publishing
- name: Imports
- name: Taxonomy
- name: Comments
- name: Assets
paths:
  /auth/login:
    post:
      operationId: loginOwner
      summary: Sign in as the owner
      tags:
      - Authentication
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Set-Cookie:
              schema:
                type: string
              description: Opaque __Host-isaber_session cookie; Secure; HttpOnly; SameSite=Strict; Path=/; no Domain. Max-Age and Expires match the selected 8-hour or 30-day lifetime.
                Never return its value in JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
      description: Same-origin JSON only; rate-limited. Invalid credentials return 401. Creates a fresh session
        cookie and returns the CSRF token. remember_me=true keeps the session for up to 30 days without idle expiry;
        false or omitted retains the 8-hour maximum and 30-minute idle limit. Both modes support logout and owner-recovery revocation.
        Owner provisioning is an operational command, not an API.
  /auth/session:
    get:
      operationId: getOwnerSession
      summary: Get the current owner session
      tags:
      - Authentication
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default:
          $ref: '#/components/responses/Problem'
  /auth/logout:
    post:
      operationId: logoutOwner
      summary: Revoke the session
      tags:
      - Authentication
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '204':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Set-Cookie:
              schema:
                type: string
              description: Clear the session cookie with the same attributes and Max-Age=0.
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
  /articles:
    get:
      operationId: listPublicArticles
      summary: List public published articles
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/article_sort'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/tag'
      description: Pinned articles come first within the matching public collection. Cursor mode then orders each group by newest first publication time and ID. Numbered mode defaults to newest writing date within each group and supports the sort parameter. Never returns drafts, private articles, or their metadata.
  /articles/search:
    get:
      operationId: searchPublicArticles
      summary: Search public published articles
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/article_sort'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/tag'
      description: Cursor mode ranks by title, then summary/tags, then body matches; ties by publication time and ID. Numbered mode defaults to newest writing date; sort can select other dates or relevance. Does not search comments. Require all whitespace-separated terms to match; rank by the highest field level needed to
        satisfy them. ASCII identifiers use case-insensitive whole-word matching; Chinese and punctuation terms use
        literal substring matching. Markdown text includes code but excludes hidden HTML and URL destinations.
        No shared caching. Busy searches return 503 with Retry-After.
  /articles/{slug}:
    get:
      operationId: getPublicArticle
      summary: Read a public published article
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      description: Returns only the live public revision even with an owner cookie. Missing or nonpublic articles
        return 404.
  /categories:
    get:
      operationId: listPublicCategories
      summary: List public categories
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Include only labels used by current public published revisions. Order by case-sensitive Unicode code-point name then ID (PostgreSQL C collation).
  /admin/categories:
    get:
      operationId: listAdminCategories
      summary: List all categories
      tags:
      - Taxonomy
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    post:
      operationId: createCategory
      summary: Create a category
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategory'
      description: Duplicate slug returns 409. Creating a label does not assign it to an article.
  /admin/categories/{label_id}:
    patch:
      operationId: renameCategory
      summary: Rename a category
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/label_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategory'
      description: Stable slug and associations; stale version returns 409. Update live metadata dates and article
        versions for current draft/published associations transactionally. Draft-only renames leave live dates
        unchanged; historical-only associations do not change current article versions/dates. An unchanged name
        with a matching version is a no-op. Descriptions accept English and Chinese plain text up to 2000 characters
        each. Description-only changes update the category version without changing article versions or content
        dates.
  /tags:
    get:
      operationId: listPublicTags
      summary: List public tags
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Include only labels used by current public published revisions. Order by case-sensitive Unicode code-point name then ID (PostgreSQL C collation).
  /admin/tags:
    get:
      operationId: listAdminTags
      summary: List all tags
      tags:
      - Taxonomy
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
    post:
      operationId: createTag
      summary: Create a tag
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '201':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLabel'
      description: Duplicate slug returns 409. Creating a label does not assign it to an article.
  /admin/tags/{label_id}:
    patch:
      operationId: renameTag
      summary: Rename a tag
      tags:
      - Taxonomy
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminLabel'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/label_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenameLabel'
      description: Stable slug and associations; stale version returns 409. Update live metadata dates and article
        versions for current draft/published associations transactionally. Draft-only renames leave live dates unchanged;
        historical-only associations do not change current article versions/dates. An unchanged name with a matching
        version is a no-op.
  /articles/{article_id}/assets/{asset_id}:
    get:
      operationId: getArticleAsset
      summary: Read an authorized article image
      tags:
      - Assets
      security:
      - {}
      - ownerSession: []
      responses:
        '200':
          description: Validated image bytes. Authorization is checked before streaming.
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/asset_id'
      description: 'Anonymous callers can read only assets attached to the current live revision of a public article.
        An authenticated owner can read retained revisions of this article. All other cases return 404. Never redirect
        to a public object URL. Always Cache-Control: no-store.'
  /articles/{article_id}/comments:
    get:
      operationId: listPublicComments
      summary: List approved article comments
      tags:
      - Comments
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Public published articles only; otherwise 404. Order by created_at then ID ascending. Existing
        approved comments remain visible if new submissions are disabled.
    post:
      operationId: submitGuestComment
      summary: Submit a comment for moderation
      tags:
      - Comments
      security: []
      responses:
        '202':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentReceipt'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitComment'
      description: 'No reader account. Require a currently public published article with comments enabled. Return
        only pending status, never moderation details or comment text. Nonpublic article: 404; comments disabled:
        409; invalid text: 422; rate limit: 429 with Retry-After. Recheck current article eligibility before receipt
        replay. Limits: 32 KiB JSON; five accepted comments per article and twenty globally per sliding minute.
        Replays consume no new quota. Busy admission: 503 with Retry-After.'
  /admin/reading/articles:
    get:
      operationId: listOwnerReadingArticles
      summary: List owner-visible published published articles
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerReadingPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/article_sort'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/tag'
      description: Requires a valid owner session. Includes current published public and private writing; excludes drafts and
        historical revisions. Browse/search filters and sort semantics match the public API. Every item includes visibility and pinned; both public and private pins come first within the owner-visible collection.
        Cursor scope is distinct from the public API.
  /admin/reading/articles/search:
    get:
      operationId: searchOwnerReadingArticles
      summary: Search owner-visible published published articles
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerReadingPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/article_sort'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/category'
      - $ref: '#/components/parameters/tag'
      description: Requires a valid owner session. Includes current published public and private writing; excludes drafts and
        historical revisions. Browse/search filters and sort semantics match the public API. Every item includes visibility and pinned; both public and private pins come first within the owner-visible collection.
        Cursor scope is distinct from the public API.
  /admin/reading/articles/{slug}:
    get:
      operationId: getOwnerReadingArticle
      summary: Read a owner-visible published published article
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerReadingArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      description: Requires a valid owner session. Includes current published public and private writing; excludes drafts and
        historical revisions. Browse/search filters and sort semantics match the public API. Every item includes visibility and pinned; both public and private pins come first within the owner-visible collection.
        Cursor scope is distinct from the public API.
  /admin/reading/categories:
    get:
      operationId: listOwnerReadingCategories
      summary: List owner-visible published categories
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Requires a valid owner session. Includes current published public and private writing; excludes drafts and
        historical revisions. Categories/tags include only labels used by these published revisions. Cursor scope is distinct
        from public and management label endpoints.
  /admin/reading/tags:
    get:
      operationId: listOwnerReadingTags
      summary: List owner-visible published tags
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Requires a valid owner session. Includes current published public and private writing; excludes drafts and
        historical revisions. Categories/tags include only labels used by these published revisions. Cursor scope is distinct
        from public and management label endpoints.
  /admin/articles:
    get:
      operationId: listAdminArticles
      summary: List owner articles
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/admin_page'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/admin_q'
      - $ref: '#/components/parameters/article_status'
      - $ref: '#/components/parameters/visibility'
      description: Includes private and draft articles. Newest modified_at first, then ID. Status is published if
        a live revision exists; has_draft is independent. Supply page for numbered results and matching totals;
        omit it to retain cursor pagination. Both modes use the same filters and ordering.
  /admin/articles/{article_id}:
    get:
      operationId: getAdminArticle
      summary: Get live and draft owner state
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
    patch:
      operationId: updateArticleControls
      summary: Change visibility, pinning, or comment controls
      tags:
      - Administration
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleControls'
      description: Controls apply immediately to current article state and all read paths. This does not publish
        the draft. Stale expected_version returns 409.
  /admin/articles/{article_id}/draft:
    patch:
      operationId: updateDraftMetadata
      summary: Save draft metadata
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPatch'
      description: Requires an existing draft; otherwise 409 no_draft. Creates a new snapshot. Omitted fields remain
        unchanged. Slug edits after first publication are rejected. Content replacement uses import, not this operation.
        Invalid references are blocking draft issues.
  /admin/articles/{article_id}/preview:
    get:
      operationId: previewDraft
      summary: Preview the current draft
      tags:
      - Publishing
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preview'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      description: Only current draft; no draft returns 404. Normalized Markdown and issue details use the same
        content rendering specification as the live page.
  /admin/articles/{article_id}/publish:
    post:
      operationId: publishArticle
      summary: Publish an article
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      description: Requires a publishable current draft. Atomically switch the live pointer and dates; clear draft
        pointer. 422 if blocked; 409 if stale or no draft. Visibility is set separately.
  /admin/articles/{article_id}/unpublish:
    post:
      operationId: unpublishArticle
      summary: Unpublish an article
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      description: Immediately remove the live pointer. Retain a newer draft, or use the withdrawn live snapshot
        as the draft. Preserve publication time and history. Already unpublished with matching version is a no-op.
  /admin/articles/{article_id}/revisions:
    get:
      operationId: listArticleRevisions
      summary: List previously published snapshots
      tags:
      - Publishing
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      description: Only snapshots that have been published. Order by first_published_at descending then ID. Draft
        is returned in owner article detail.
  /admin/articles/{article_id}/revisions/{revision_id}:
    get:
      operationId: getArticleRevision
      summary: Read a historical published snapshot
      tags:
      - Publishing
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Revision'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/revision_id'
      description: Revision must belong to the article and have publication history; otherwise 404.
  /admin/articles/{article_id}/revisions/{revision_id}/restore:
    post:
      operationId: restoreArticleRevision
      summary: Copy history into a new draft
      tags:
      - Publishing
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminArticle'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/article_id'
      - $ref: '#/components/parameters/revision_id'
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCommand'
      description: Only a previously published revision of this article. Does not publish, change visibility, or
        change the stable slug. Replace an existing draft with a new snapshot, preserving historical metadata and image
        memberships. Article publication/update dates and controls remain unchanged. Draft-only or cross-article sources
        return 404; stale article version returns 409. Retry with the same key/body to replay the original result.
  /admin/imports:
    post:
      operationId: createImport
      summary: Upload Markdown or a ZIP for draft import
      tags:
      - Imports
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '202':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
            Location:
              schema:
                type: string
              description: /api/v1/admin/imports/{import_id} for polling.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 'One UTF-8 .md or ZIP with exactly one article and images. New import: omit article_id and expected_version.
        Replacement: require both. 5 MiB Markdown; 10 MiB per image; 50 MiB compressed ZIP; 100 MiB expanded ZIP;
        200 files (400 total file/directory entries). Images are limited to 16 million pixels and must decode as
        PNG, JPEG, GIF, or WebP matching their extension. Reject encrypted, split, ZIP64, unsafe-path and special-file
        archives. 413 for request size, 415 for unsupported file kind, 422 for invalid request fields. Structural
        processing errors appear in a failed job. Missing editorial metadata/assets can produce a successful but
        non-publishable draft. Existing state changes only after complete processing and a second version check.
        Jobs and staged files are durable; restart failures must be explicit. Replayed requests return the original
        acceptance, then poll the job.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                article_id:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  minimum: 1
              required:
              - file
              additionalProperties: false
              dependentRequired:
                article_id:
                - expected_version
                expected_version:
                - article_id
            encoding:
              file:
                contentType: text/markdown, application/zip, application/octet-stream
  /admin/imports/{import_id}:
    get:
      operationId: getImport
      summary: Get import progress and results
      tags:
      - Imports
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/import_id'
      description: Returns 200 for all existing job states, including failure. Poll until succeeded or failed; article/revision
        IDs identify the committed draft after success.
  /admin/comments:
    get:
      operationId: listAdminComments
      summary: List comments for moderation
      tags:
      - Comments
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCommentPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/cursor'
      - $ref: '#/components/parameters/comment_article'
      - $ref: '#/components/parameters/comment_status'
      description: Newest created_at first then ID; includes pending comments and comments on unpublished/private
        articles.
  /admin/comments/{comment_id}:
    patch:
      operationId: moderateComment
      summary: Approve, reject, or remove a comment
      tags:
      - Comments
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminComment'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/comment_id'
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModerateComment'
      description: Stale version returns 409. Removing is a logical moderation state, not physical deletion. Approved
        comments are public only while the article is public and published. Text is immutable; an unchanged status with
        a matching version is a no-op.
  /categories/{slug}:
    get:
      operationId: getPublicCategory
      summary: Read category descriptions and visible article count
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      description: Owner scope includes private published articles and empty categories. Public scope returns
        404 unless the category has a current public published article; private-only counts and metadata are
        never returned.
  /categories/{slug}/articles:
    get:
      operationId: listPublicCategoryArticles
      summary: Browse or search within one category
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticlePage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/article_sort'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/tag'
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: .*\S.*
        description: Optional all-term article search within this category.
      description: Category is fixed by slug. Numbered pagination defaults to page 1. category and cursor query
        parameters are rejected. Category pins come first within each date-sorted browse group; global pins do
        not affect this page. With q, the existing all-term search and date/relevance order apply without boosting
        any pins. Public scope excludes private articles and private-only category metadata.
  /admin/reading/categories/{slug}:
    get:
      operationId: getOwnerCategory
      summary: Read category descriptions and visible article count
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      description: Owner scope includes private published articles and empty categories. Public scope returns
        404 unless the category has a current public published article; private-only counts and metadata are
        never returned.
  /admin/reading/categories/{slug}/articles:
    get:
      operationId: listOwnerCategoryArticles
      summary: Browse or search within one category
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success
          headers:
            Cache-Control:
              schema:
                type: string
              description: private, no-store
            X-Robots-Tag:
              schema:
                type: string
              description: noindex, nofollow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnerReadingPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/slug'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/article_sort'
      - $ref: '#/components/parameters/language'
      - $ref: '#/components/parameters/tag'
      - name: q
        in: query
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 200
          pattern: .*\S.*
        description: Optional all-term article search within this category.
      description: Category is fixed by slug. Numbered pagination defaults to page 1. category and cursor query
        parameters are rejected. Category pins come first within each date-sorted browse group; global pins do
        not affect this page. With q, the existing all-term search and date/relevance order apply without boosting
        any pins. Public scope excludes private articles and private-only category metadata.
  /friends:
    get:
      operationId: listFriends
      summary: List published friend links in owner-selected order
      tags:
      - Public
      security: []
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendDirectory'
        default:
          $ref: '#/components/responses/Problem'
      description: Published entries only, including for signed-in owners. No private
        request, email, ordering, or version fields are returned. No server-side avatar
        fetch.
  /friend-requests:
    post:
      operationId: submitFriendRequest
      summary: Submit a private friend-link request
      tags:
      - Public
      security: []
      responses:
        '202':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestAccepted'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitFriendRequest'
      description: 'Same-origin JSON. Required UUID retry key is retained for 24 hours.
        Pending requests and reply email stay owner-only; no email is sent. Global limit:
        five accepted requests per minute, 1000 pending requests, two simultaneous body/database
        operations. Quota rejections return Retry-After. Image URLs are stored, never
        fetched by the server.'
  /admin/friends:
    get:
      operationId: listAdminFriends
      summary: List all published and hidden directory entries
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFriendDirectory'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: createFriend
      summary: Create a hidden friend-link draft
      tags:
      - Administration
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '201':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFriend'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFriend'
      description: Creates a hidden draft. Directory capacity is 200 entries.
  /admin/friends/{friend_id}:
    patch:
      operationId: updateFriend
      summary: Edit, publish or hide a friend link
      tags:
      - Administration
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFriend'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: friend_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFriend'
      description: Requires the current version. Publication is a separate explicit
        owner action. Hiding retains the entry.
  /admin/friends/order:
    put:
      operationId: reorderFriends
      summary: Reorder the complete directory atomically
      tags:
      - Administration
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendsReordered'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FriendOrder'
      description: Supply every current directory ID exactly once, including hidden
        entries, with its expected version. A missing/duplicate/stale entry returns
        409 and rolls back all changes. Success increments all entry versions.
  /admin/friend-requests:
    get:
      operationId: listFriendRequests
      summary: Review private friend-link requests
      tags:
      - Administration
      security:
      - ownerSession: []
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequestPage'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        schema:
          type: string
          enum:
          - pending
          - approved
          - rejected
      description: Owner-only reply emails and request metadata. Newest first; unknown
        or repeated parameters are rejected.
  /admin/friend-requests/{request_id}:
    patch:
      operationId: reviewFriendRequest
      summary: Approve a request as a hidden draft, or reject it
      tags:
      - Administration
      security:
      - ownerSession: []
        csrfToken: []
      responses:
        '200':
          description: Success; no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FriendRequest'
        default:
          $ref: '#/components/responses/Problem'
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewFriendRequest'
      description: Only pending requests may be reviewed. Approval atomically creates
        one hidden directory draft and records its ID. It never publishes or sends an
        email. Current version is required; repeated or stale reviews return 409.
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: __Host-isaber_session
      description: Opaque HttpOnly Secure SameSite=Strict owner session; never store in browser localStorage.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by owner login/session. Required with session for every owner mutation except
        login.
  parameters:
    article_id:
      name: article_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    revision_id:
      name: revision_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    import_id:
      name: import_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    asset_id:
      name: asset_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    label_id:
      name: label_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    comment_id:
      name: comment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Stable URL identifier; supply a romanized or English identifier for Chinese titles.
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      description: Opt into numbered pagination with limit as page size. Cannot combine with cursor. Responses include page, page_size, total, and total_pages; a page beyond the collection resolves to its last page. An empty collection uses page 1 of 1. Totals include only matching public published articles. Omit page to retain cursor pagination.
    admin_page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 2147483647
      description: Opt into numbered owner pagination with limit as page size. Cannot combine with cursor. Responses include page, page_size, total, and total_pages. Totals include all matching owner articles, including private articles and drafts. A page beyond the collection resolves to its last page. An empty collection uses page 1 of 1. Omit page to retain cursor pagination.
    article_sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [written, written_oldest, updated, updated_oldest, newest, oldest, relevance]
      description: Requires numbered pagination (page). Numbered browse and search default to written (newest writing date first). written_oldest reverses that order; updated and updated_oldest use the live article update timestamp; newest and oldest use first publication time. For browse listings, pinned articles come first and the chosen date orders each group. Search does not promote pins; its chosen date orders all matching results. ID breaks ties in the same direction and missing dates sort last. relevance is accepted only for search. Browse cursors order pinned first, then publication time and ID; older cursors without a pin field resume in the unpinned group. Search cursors retain relevance order.
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      description: Opaque continuation token tied to the original filters and query.
    q:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: .*\S.*
      description: Nonempty text, at most 200 Unicode characters. All whitespace-separated terms must match. ASCII
        identifiers match whole words ignoring case; Chinese and punctuation terms match literal substrings.
    admin_q:
      name: q
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
        pattern: .*\S.*
      description: Title search across draft or latest retained article titles.
    language:
      name: language
      in: query
      required: false
      schema:
        type: string
        enum:
        - en
        - zh
    category:
      name: category
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Stable URL identifier; supply a romanized or English identifier for Chinese titles.
    tag:
      name: tag
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 160
        pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        description: Stable URL identifier; supply a romanized or English identifier for Chinese titles.
    article_status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - draft
        - published
    visibility:
      name: visibility
      in: query
      required: false
      schema:
        type: string
        enum:
        - public
        - private
    comment_status:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
        - pending
        - approved
        - rejected
        - removed
    comment_article:
      name: article_id
      in: query
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Retained for 24 hours. Replays the original result for the same semantic payload; mismatched
        payload or in-progress request returns 409. See API design for scope and authorization.
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must exactly match the configured browser site origin. Missing/mismatched origins are rejected.
  responses:
    Problem:
      description: Error; see code, field errors, and request_id. Private and missing public resources use indistinguishable
        404 responses.
      headers:
        Cache-Control:
          schema:
            type: string
          description: no-store
        Retry-After:
          schema:
            type: string
          description: Seconds until retry for rate limits, temporary unavailability, or an in-progress idempotent
            request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Friend:
      type: object
      properties:
        id:
          type: string
          format: uuid
        site_name:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        site_url:
          type: string
          format: uri
          pattern: ^https://
          maxLength: 2048
        introduction:
          type: string
          minLength: 1
          maxLength: 300
          pattern: \S
        icon_url:
          type: string
          maxLength: 2048
          anyOf:
          - const: ''
          - format: uri
            pattern: ^https://
      required:
      - id
      - site_name
      - site_url
      - introduction
      - icon_url
      additionalProperties: false
    AdminFriend:
      type: object
      properties:
        id:
          type: string
          format: uuid
        site_name:
          type: string

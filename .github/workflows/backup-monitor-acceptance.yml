# Temporary branch-only acceptance; removed after the live check/notification drill.
name: Backup monitor acceptance
on:
  push:
    branches: [feat/backup-health-alerts]
permissions:
  contents: read
jobs:
  real-monitor:
    name: Verify real restricted JD and Tencent health
    runs-on: ubuntu-24.04
    environment: backup-monitor-acceptance
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check real backup without modifying it
        env:
          BACKUP_MONITOR_SSH_KEY: ${{ secrets.BACKUP_MONITOR_SSH_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_PORT: ${{ vars.STAGING_PORT }}
          STAGING_SSH_HOST_KEY: ${{ vars.STAGING_SSH_HOST_KEY }}
        run: python3 infra/staging/backup_monitor.py
  notification-drill:
    name: Intentional notification drill (no server access)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Fail on a synthetic backup failure to test GitHub notification
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path("infra/staging").resolve()))
          from backup_monitor import publish
          now = datetime.now(timezone.utc)
          report = {"version": 1, "checked_at": now.isoformat(), "timer_enabled": True,
              "timer_active": True, "service_active": "failed", "service_result": "exit-code",
              "last_attempt": "failed", "last_snapshot_id": now.strftime("%Y%m%dT%H%M%SZ-1234abcd"),
              "vault_verified": True, "disk_free_bytes": 8 * 1024**3, "pending": False, "errors": []}
          print("Intentional alert drill: no real backup or server was changed.")
          raise SystemExit(publish(report, now))
          PY

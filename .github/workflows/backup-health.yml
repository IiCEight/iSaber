# This runs independently of JD, so a stopped JD host also fails the check.
name: Offsite backup health
on:
  schedule:
    # Hourly at minute 17, away from the busiest top-of-hour scheduling period.
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offsite-backup-health
  cancel-in-progress: false
jobs:
  health:
    name: Check JD backup and Tencent copy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Check out trusted main monitor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify backup health through a read-only SSH identity
        env:
          BACKUP_MONITOR_SSH_KEY: ${{ secrets.BACKUP_MONITOR_SSH_KEY }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_PORT: ${{ vars.STAGING_PORT }}
          STAGING_SSH_HOST_KEY: ${{ vars.STAGING_SSH_HOST_KEY }}
        # The command exits nonzero for failed/overdue backups or unavailable
        # monitoring. GitHub's native failed-workflow notifications then apply.
        run: python3 infra/staging/backup_monitor.py

name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Let main finish deployment/rollback; superseded PR checks can be canceled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: contracts/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r contracts/requirements.txt
      - run: python contracts/check_contract.py

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:smoke

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: isaber_test
          POSTGRES_PASSWORD: isaber_ci_only
          POSTGRES_DB: isaber_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U isaber_test -d isaber_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://isaber_test:isaber_ci_only@127.0.0.1:5432/isaber_test?sslmode=disable
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test -race -tags=integration ./internal/...
      - run: go build -trimpath -o bin/isaber-api ./cmd/api
      - run: go build -trimpath -o bin/isaber-migrate ./cmd/migrate
      - run: go build -trimpath -o bin/isaber-owner ./cmd/owner

  containers:
    name: Containers
    needs: [contract, frontend, backend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      frontend: ${{ steps.publish.outputs.frontend }}
      backend: ${{ steps.publish.outputs.backend }}
    env:
      COMPOSE_FILE: infra/compose.rehearsal.yml
      COMPOSE_PROJECT_NAME: isaber-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check deployment scripts
        run: |
          bash -n infra/deploy.sh infra/ssh-entry.sh infra/publish.sh
          bash infra/tests/deploy.test.sh
          FRONTEND_IMAGE=isaber-frontend:rehearsal BACKEND_IMAGE=isaber-api:rehearsal \
            docker compose --env-file infra/production.env.example --file infra/compose.yml config --quiet
      - name: Build application images once
        run: docker compose build
      - name: Test the built images with a disposable database
        run: |
          docker compose up -d --wait postgres
          docker compose run --rm --no-deps migrate up
          docker compose exec -T postgres psql -X -v ON_ERROR_STOP=1 -U rehearsal -d rehearsal < infra/grant-runtime.sql
          rights=$(docker compose exec -T postgres psql -X -U rehearsal -d rehearsal -Atc "SELECT has_column_privilege('isaber_runtime','owners','password_hash','UPDATE'),has_table_privilege('isaber_runtime','owners','INSERT'),has_table_privilege('isaber_runtime','goose_db_version','UPDATE'),has_schema_privilege('isaber_runtime','public','CREATE');")
          test "$rights" = 'f|f|f|f'
          docker compose up -d --wait api frontend
          docker compose exec -T frontend node --input-type=module < infra/tests/container-smoke.mjs
          docker compose stop postgres
          docker compose exec -T frontend node -e "fetch('http://api:8080/readyz',{signal:AbortSignal.timeout(10000)}).then(r=>process.exit(r.status===503?0:1)).catch(()=>process.exit(1))"
          docker compose restart postgres api frontend
          docker compose up -d --wait api frontend
          test "$(docker compose run --rm --no-deps -T migrate up)" = "Applied 0 migrations"
          docker compose exec -T frontend node --input-type=module < infra/tests/container-smoke.mjs
      - name: Publish the tested images to GHCR
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash infra/publish.sh
      - name: Show synthetic container logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - name: Remove this run's disposable resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy blog
    needs: containers
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      vars.BLOG_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    steps:
      - name: Ask the host to pull and deploy the exact tested digests
        env:
          FRONTEND_DIGEST: ${{ needs.containers.outputs.frontend }}
          BACKEND_DIGEST: ${{ needs.containers.outputs.backend }}
          BLOG_SSH_KEY: ${{ secrets.BLOG_SSH_KEY }}
          BLOG_SSH_HOST_KEY: ${{ vars.BLOG_SSH_HOST_KEY }}
          BLOG_SSH_HOST: ${{ vars.BLOG_SSH_HOST }}
          BLOG_SSH_USER: ${{ vars.BLOG_SSH_USER }}
        run: |
          set -euo pipefail
          [[ "$BLOG_SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$BLOG_SSH_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$BLOG_SSH_HOST_KEY" != *$'\n'* ]]
          umask 077
          printf '%s\n' "$BLOG_SSH_KEY" > "$RUNNER_TEMP/blog-key"
          printf 'isaber-production %s\n' "$BLOG_SSH_HOST_KEY" > "$RUNNER_TEMP/blog-hosts"
          ssh-keygen -l -f "$RUNNER_TEMP/blog-hosts" >/dev/null
          printf '%s\n%s\n' "$FRONTEND_DIGEST" "$BACKEND_DIGEST" |
            ssh -i "$RUNNER_TEMP/blog-key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o StrictHostKeyChecking=yes -o HostKeyAlias=isaber-production \
              -o UserKnownHostsFile="$RUNNER_TEMP/blog-hosts" -o ConnectTimeout=20 \
              -o ForwardAgent=no -o ClearAllForwardings=yes \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              "$BLOG_SSH_USER@$BLOG_SSH_HOST" deploy
